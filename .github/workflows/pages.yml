# Builds the static preview (scripts/build-pages.sh) and publishes it to GitHub Pages
# → https://sydefxxs.github.io/wedding-website/  on every push to main.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/build-pages.sh
        env:
          PAGES_BASE_PATH: /wedding-website
          NEXT_PUBLIC_SITE_URL: https://sydefxxs.github.io
          NEXT_TELEMETRY_DISABLED: 1
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
